<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScarletMSD — Manga Reader</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Scarlet<span>MSD</span></a>
    <form id="searchForm" class="searchbar">
      <input id="searchInput" type="search" placeholder="Cari manga / doujinshi…" autocomplete="off">
      <button type="submit">Cari</button>
    </form>
  </header>

  <nav class="tabs hide" id="orderTabs">
    <a href="#/browse?order=update" data-order="update" class="active">Terbaru</a>
    <a href="#/browse?order=popular" data-order="popular">Populer</a>
    <a href="#/browse?order=rating" data-order="rating">Rating</a>
  </nav>

  <main id="app">
    <section id="view" aria-live="polite"></section>
    <div id="msg" class="msg hide"></div>
  </main>

  <footer>
    <p>Sumber data: <a href="https://doujinku.org/" target="_blank" rel="noopener">doujinku.org</a> ·
    scraper offline + proxy gambar · hanya untuk keperluan pribadi.</p>
    <p><a href="#/about">Tentang App &amp; Dev</a> ·
    <a href="https://github.com/Prof-Claret" target="_blank" rel="noopener">GitHub @Prof-Claret</a></p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
